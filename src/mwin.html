<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explainer</title>
    <link rel="stylesheet" href="mwin.css"/>

  </head>

  <body>

    <div class="container">
      <div class="container_inline">
        
              <h1>
                Explainer is here to explain you.
              </h1>
              <h2>
                What's your query?
              </h2>
              <div class="inout_container">
                <div class="inout_container_inline">
                  <div class="input_box">
                    <input id="query" type="text"/>
                    <button id="submit">Submit</button>
                  </div>
                  <div class="output_box">
                    <fieldset>
                      <legend>Explanation</legend>

                      <p id="win_ex">You will get your explanation soon.
                      </p>
                    </fieldset>
                  </div>

                </div>
              </div>

              <div class="theme_toggle_inline">
                <p>Go Dark</p>
                <label class="switch">
                  <input type="checkbox" id="toggle">
                  <span class="slider"></span> 
                </label>
              </div>
      </div>


    </div>

    <script src="mwin.js"></script>
    <script src="../config.js"></script>
  </body>

</html>
